version: "2"

run:
  tests: true
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Correctness
    - errcheck          # Check for unchecked errors
    - govet             # Vet examines Go source code and reports suspicious constructs
    - ineffassign       # Detect ineffectual assignments
    - staticcheck       # Advanced Go linter (includes gosimple checks)
    - unused            # Check for unused code

    # Style
    - misspell          # Finds commonly misspelled English words

    # Bugs
    - bodyclose         # Check whether HTTP response body is closed successfully
    - errchkjson        # Check for JSON encoding/decoding errors
    - nilerr            # Find code that returns nil even if it checks that error is not nil
    - rowserrcheck      # Check whether Rows.Err is checked successfully
    - sqlclosecheck     # Check that sql.Rows and sql.Stmt are closed

    # Complexity
    - gocyclo           # Check cyclomatic complexity
    - funlen            # Check function length

    # Performance
    - prealloc          # Find slice declarations that could potentially be pre-allocated

    # Testing
    - testifylint       # Check for common testify mistakes

    # Code Quality
    - nakedret          # Find naked returns in functions greater than specified function length
    - noctx             # Find sending HTTP request without context.Context
    - nolintlint        # Report ill-formed or insufficient nolint directives
    - goprintffuncname  # Check that printf-like functions are named with f at the end
    - gosec             # Inspect source code for security problems

    # Documentation
    - godot             # Check if comments end in a period

    # Conventions
    - importas          # Enforce consistent import aliases
    - revive            # Configurable style checks
    - gocritic          # Opinionated correctness, performance, and style checks

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    govet:
      enable-all: true
      # enable-all turns on fieldalignment, which orders struct fields by
      # size rather than by meaning. Go dropped it from vet's defaults for
      # that reason. A wire envelope should read {JSONRPC, ID, Result, Error}.
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: false

    gocyclo:
      min-complexity: 20

    funlen:
      lines: 80
      statements: 40

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    staticcheck:
      checks: ["all"]

    revive:
      rules:
        # get-return would flag every GetTuples/GetSchema/GetRecord/GetTuple
        # on the store API. That Get* vocabulary is a deliberate KV-shaped
        # convention, written down in store/doc.go and docs/concepts/drivers.md.
        # A method returning only a yes/no is named for what it asks
        # (NamespaceExists), which get-return has no way to detect.
        - name: get-return
          disabled: true

    importas:
      alias:
        # Wrap and ErrorTags only; everything else comes from stdlib errors.
        # See the Error tags section of the core package doc.
        - pkg: github.com/gojekfarm/xtools/errors
          alias: xerrors

    gosec:
      excludes:
        - G304  # File inclusion via variable — expected for filesystem store

    testifylint:
      enable-all: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gosec
          - errcheck

      # Ignore shadow declarations in tests
      - path: _test\.go
        text: 'declaration of "(err|ctx)" shadows declaration at'
        linters:
          - govet

      # Shared test suites can be long
      - path: ^storetest/
        linters:
          - funlen

      # Filter-then-append patterns cannot be preallocated
      - path: ^store/
        linters:
          - prealloc

      # Ignore deprecation warnings
      - text: "^SA1019:.* is deprecated:"
        linters:
          - staticcheck

formatters:
  enable:
    - gofumpt
    - gci

  settings:
    gofumpt:
      module-path: github.com/xdb-dev/xdb
      extra-rules: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/xdb-dev/xdb)
        - blank
        - dot
      custom-order: true

  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
