name: ecommerce-store
description: "Run a small store: catalog, orders that reserve stock, a lost-update conflict, and dropping a product line."
tags: [ecommerce, money, versioning, cascade, batch]
namespace: shop
max_turns: 60
budget:
  failed_commands: 10
  cost_usd: 3.00

# Expected values. Recompute them when you change a fixture.
#   catalog.csv       6 products, 2 in the pantry category
#   orders.ndjson     4 orders. ORD-1003 exceeds stock, so the agent must reject it.
#   stock after       SAREE-KANCHI-01 2, CHAI-MASALA-500 33, CHAI-GREEN-250 22, KURTA-COTTON-M 10, KURTA-COTTON-L 0, DIYA-BRASS-SET 14
#   ORD-1002 total    ₹15,997.00 -> 1599700 paise
#   phase 3           the first write wins. The stale second write must fail with CONFLICT. Final stock 9.
#   after cascade     4 products remain, 4 orders untouched

phases:
  - name: model
    prompt: |
      I run a small online store and want to manage it from the command
      line. Use the namespace `$NS`.

      Set up `products` and `orders`. Load `catalog.csv` from this
      directory. Use the SKU as the product id. Prices are in rupees;
      store money so that it never loses precision.
    checks:
      - name: products schema exists
        run: xdb schemas get xdb://$NS/products -o json
        expect: { exit: 0 }
      - name: orders schema exists
        run: xdb schemas get xdb://$NS/orders -o json
        expect: { exit: 0 }
      - name: six products
        run: xdb records list xdb://$NS/products -o ndjson --limit 100
        expect: { exit: 0, ndjson_count: 6 }
      - name: sku is the id
        run: xdb records get xdb://$NS/products/CHAI-MASALA-500 -o json
        expect: { exit: 0 }

  - name: orders
    prompt: |
      Process `orders.ndjson` in file order. Use the order id from the file
      as the record id. An order is accepted only when every line has enough
      stock; accepting it decrements the stock of each product. An order
      that cannot be filled is still recorded, marked rejected, and changes
      no stock. Every order stores its total.

      Then tell me the remaining stock of CHAI-MASALA-500. End with
      `ANSWER: <units>`.
    checks:
      - name: masala chai stock
        answer: "33"
      - name: four orders recorded
        run: xdb records list xdb://$NS/orders -o ndjson --limit 100
        expect: { exit: 0, ndjson_count: 4 }
      - name: rejected order recorded
        run: xdb records get xdb://$NS/orders/ORD-1003 -o json
        expect: { exit: 0 }
      - name: stock untouched by rejected order
        run: xdb records get xdb://$NS/products/KURTA-COTTON-L -o json
        expect: { exit: 0 }

  - name: conflict
    prompt: |
      Two of us edit the catalog at the same time and I want to know what
      happens. Simulate it on KURTA-COTTON-M: read the product once, then
      make two competing writes that both start from that same read. The
      first sets stock to 9. The second, still based on the original read,
      sets stock to 8. The second write must not silently overwrite the
      first. Report what happened to each write.

      Then tell me the final stock of KURTA-COTTON-M. End with
      `ANSWER: <units>`.
    checks:
      - name: first write wins
        answer: "9"

  - name: discontinue
    prompt: |
      We are dropping the pantry line. Move the pantry products into their
      own schema `pantry` in the same namespace, remove them from
      `products`, and then delete the `pantry` schema together with
      everything in it, in one command. Orders must stay untouched.

      Then tell me how many products remain. End with `ANSWER: <count>`.
    checks:
      - name: remaining products
        answer: "4"
      - name: pantry schema gone
        run: xdb schemas get xdb://$NS/pantry -o json
        expect: { exit: 1, error: { code: NOT_FOUND } }
      - name: four products remain
        run: xdb records list xdb://$NS/products -o ndjson --limit 100
        expect: { exit: 0, ndjson_count: 4 }
      - name: orders untouched
        run: xdb records list xdb://$NS/orders -o ndjson --limit 100
        expect: { exit: 0, ndjson_count: 4 }

rubric: |
  Score each 1 to 5.
  - Money is stored as an integer minor unit (paise), not a float or a string.
  - Stock is an integer and was decremented with a patch, not a full replace.
  - Order lines reference products by SKU and carry the quantity.
  - The conflict in phase 3 was demonstrated with `_version` and the CONFLICT error, not by narration.
  - The pantry line was removed with a cascade delete, not one record at a time.
