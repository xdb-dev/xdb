<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XDB: social card</title>
<!-- Source for og.png. Rendered to a PNG by the command in README.md;
     it is never linked from the site itself. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="site.css">
<style>
  html, body { margin: 0; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 76px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .eyebrow { font-size: 17px; letter-spacing: .18em; margin: 0 0 26px; }
  .card h1 {
    font-size: 92px;
    line-height: 1.0;
    font-weight: 600;
    letter-spacing: -.035em;
  }
  .card .lede { font-size: 27px; max-width: none; margin-top: 44px; }
  .uri {
    font-family: var(--mono);
    font-size: 29px;
    font-weight: 500;
    letter-spacing: -.01em;
    padding: 26px 30px;
    align-self: flex-start;
    border: 2px solid var(--accent);
    background: #e8ecfb;
  }
  .uri .dim { color: var(--muted); }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 23px;
  }
  .foot img { display: block; width: 180px; height: 54px; }
  .foot span { font-family: var(--mono); font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div>
    <p class="eyebrow">EASY FOR HUMANS · EXACT FOR AGENTS</p>
    <h1>Think in tuples.<br><span class="underlined">Storage is a detail.</span></h1>
    <p class="lede">Tuples in memory, files, Redis, or SQLite.</p>
  </div>

  <div class="uri">
    <span class="dim">xdb://</span><span class="p-ns">com.example</span><span class="dim">/</span><span class="p-schema">posts</span><span class="dim">/</span><span class="p-id">p-1</span><span class="dim">#</span><span class="p-attr">author.name</span> <span class="dim">=</span> <span class="p-val">"Ada"</span>
  </div>

  <div class="foot">
    <img src="logo.svg" alt="xdb" width="180" height="54">
    <span>go install github.com/xdb-dev/xdb/cmd/xdb@latest</span>
  </div>
</div>

</body>
</html>
