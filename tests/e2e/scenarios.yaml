version: "0.1.0"

# Real-world agent workflows for the xdb CLI.
#
# Templating (substituted before exec):
#   $NS  - unique namespace per scenario, e.g. "e2e-blog-7f3a"
#   $NOW - RFC3339 timestamp captured at suite start
#
# Assertion vocabulary:
#   exit             - exact exit code
#   stdout_contains  - substring match on stdout
#   stderr_contains  - substring match on stderr
#   json             - partial-match on parsed stdout JSON (every k/v must be present)
#   ndjson_count     - number of NDJSON lines on stdout
#   ndjson_ids       - unordered set of _id values across NDJSON lines
#   error            - partial-match on the error envelope (code, resource, action)

scenarios:
  - name: "blog-publishing-flow"
    description: "Author defines a posts schema, drafts and publishes posts, queries published only, retracts one."
    steps:
      - name: "create posts schema"
        run: xdb schemas create --uri xdb://$NS/posts --json '{"fields":{"title":{"type":"string"},"body":{"type":"string"},"published":{"type":"boolean"},"created_at":{"type":"time"}}}'
        expect: { exit: 0 }

      - name: "create draft post"
        run: xdb records create --uri xdb://$NS/posts/hello --json '{"title":"Hello","body":"first","published":false,"created_at":"2024-01-01T00:00:00Z"}' -o json
        expect:
          exit: 0
          json: { _id: "hello", published: false }

      - name: "publish via update — patch preserves untouched fields"
        run: xdb records update --uri xdb://$NS/posts/hello --json '{"published":true}' -o json
        expect:
          exit: 0
          json: { published: true, title: "Hello" }

      - name: "create second post (already published)"
        run: xdb records create --uri xdb://$NS/posts/world --json '{"title":"World","body":"second","published":true,"created_at":"2024-01-02T00:00:00Z"}'
        expect: { exit: 0 }

      - name: "filter list — published only"
        run: xdb records list --uri xdb://$NS/posts --filter 'published == true' --fields _id,title -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["hello", "world"]

      - name: "delete without --force is rejected"
        run: xdb records delete --uri xdb://$NS/posts/world
        expect:
          exit: 3
          stderr_contains: "force"
          error: { code: "INVALID_ARGUMENT", resource: "records", action: "delete" }

      - name: "delete with --force"
        run: xdb records delete --uri xdb://$NS/posts/world --force
        expect: { exit: 0 }

      - name: "list now shows one"
        run: xdb records list --uri xdb://$NS/posts -o ndjson
        expect:
          exit: 0
          ndjson_count: 1
          ndjson_ids: ["hello"]

  - name: "user-profile-crud"
    description: "Upsert idempotency and partial-update semantics on a user profile schema."
    steps:
      - name: "create users schema"
        run: xdb schemas create --uri xdb://$NS/users --json '{"fields":{"email":{"type":"string"},"name":{"type":"string"},"verified":{"type":"boolean"}}}'
        expect: { exit: 0 }

      - name: "first upsert creates"
        run: xdb records upsert --uri xdb://$NS/users/u1 --json '{"email":"a@x.io","name":"Ada","verified":false}' -o json
        expect:
          exit: 0
          json: { email: "a@x.io", name: "Ada", verified: false }

      - name: "second upsert fully replaces (no name field → name absent or zero)"
        run: xdb records upsert --uri xdb://$NS/users/u1 --json '{"email":"a@x.io","verified":true}' -o json
        expect:
          exit: 0
          json: { email: "a@x.io", verified: true }

      - name: "update is a patch — verifying email keeps verified=true"
        run: xdb records update --uri xdb://$NS/users/u1 --json '{"name":"Ada Lovelace"}' -o json
        expect:
          exit: 0
          json: { email: "a@x.io", verified: true, name: "Ada Lovelace" }

      - name: "get reflects accumulated state"
        run: xdb records get --uri xdb://$NS/users/u1 -o json
        expect:
          exit: 0
          json: { _id: "u1", email: "a@x.io", verified: true, name: "Ada Lovelace" }

  - name: "feature-flag-toggle"
    description: "Boolean feature flags: toggle on/off, --quiet returns exit code only."
    steps:
      - name: "create flags schema"
        run: xdb schemas create --uri xdb://$NS/flags --json '{"fields":{"enabled":{"type":"boolean"},"rollout":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "create flag (off)"
        run: xdb records create --uri xdb://$NS/flags/dark_mode --json '{"enabled":false,"rollout":0}'
        expect: { exit: 0 }

      - name: "toggle on"
        run: xdb records update --uri xdb://$NS/flags/dark_mode --json '{"enabled":true,"rollout":50}' -o json
        expect:
          exit: 0
          json: { enabled: true, rollout: 50 }

      - name: "--quiet suppresses stdout"
        run: xdb records get --uri xdb://$NS/flags/dark_mode --quiet
        expect:
          exit: 0
          stdout_empty: true

      - name: "list enabled flags via filter"
        run: xdb records list --uri xdb://$NS/flags --filter 'enabled == true' -o ndjson
        expect:
          exit: 0
          ndjson_count: 1
          ndjson_ids: ["dark_mode"]

  - name: "schema-evolution"
    description: "Add a new field to an existing schema; old records remain readable."
    steps:
      - name: "v1 schema (title only)"
        run: xdb schemas create --uri xdb://$NS/notes --json '{"fields":{"title":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "create note under v1"
        run: xdb records create --uri xdb://$NS/notes/n1 --json '{"title":"old"}'
        expect: { exit: 0 }

      - name: "evolve schema — add body field"
        run: xdb schemas update --uri xdb://$NS/notes --json '{"fields":{"title":{"type":"string"},"body":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "old record still readable"
        run: xdb records get --uri xdb://$NS/notes/n1 -o json
        expect:
          exit: 0
          json: { _id: "n1", title: "old" }

      - name: "new record uses new field"
        run: xdb records create --uri xdb://$NS/notes/n2 --json '{"title":"new","body":"with body"}' -o json
        expect:
          exit: 0
          json: { title: "new", body: "with body" }

  - name: "validation-rejects-bad-types"
    description: "SCHEMA_VIOLATION fires when a record violates a typed field; envelope carries actionable info."
    steps:
      - name: "create typed schema"
        run: xdb schemas create --uri xdb://$NS/items --json '{"fields":{"name":{"type":"string"},"qty":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "qty as a string is rejected"
        run: xdb records create --uri xdb://$NS/items/x --json '{"name":"widget","qty":"not-a-number"}' -o json
        expect:
          exit: 1
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "create" }

      - name: "valid qty succeeds"
        run: xdb records create --uri xdb://$NS/items/x --json '{"name":"widget","qty":42}' -o json
        expect:
          exit: 0
          json: { name: "widget", qty: 42 }

  - name: "not-found-and-recovery"
    description: "Get on a missing record returns NOT_FOUND with a helpful hint; create then read succeeds."
    steps:
      - name: "schema for the lookup"
        run: xdb schemas create --uri xdb://$NS/keys --json '{"fields":{"value":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "get missing record → NOT_FOUND"
        run: xdb records get --uri xdb://$NS/keys/ghost -o json
        expect:
          exit: 1
          error: { code: "NOT_FOUND", resource: "records", action: "get" }

      - name: "create it"
        run: xdb records create --uri xdb://$NS/keys/ghost --json '{"value":"materialized"}'
        expect: { exit: 0 }

      - name: "now get succeeds"
        run: xdb records get --uri xdb://$NS/keys/ghost -o json
        expect:
          exit: 0
          json: { _id: "ghost", value: "materialized" }

  - name: "agent-self-discovery"
    description: "An agent uses describe to learn the surface, then introspects a live schema it just created."
    steps:
      - name: "list resource × action matrix"
        run: xdb describe --actions
        expect:
          exit: 0
          stdout_contains: "records"

      - name: "describe records.list parameters"
        run: xdb describe records.list
        expect:
          exit: 0
          stdout_contains: "filter"

      - name: "create a schema to introspect"
        run: xdb schemas create --uri xdb://$NS/articles --json '{"fields":{"slug":{"type":"string"},"hits":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "describe the live schema URI"
        run: xdb describe --uri xdb://$NS/articles
        expect:
          exit: 0
          stdout_contains: "slug"

  - name: "bulk-import-via-stdin"
    description: "Pipe NDJSON operations into xdb batch: one {op, uri, data} object per line, executed atomically."
    steps:
      - name: "schema for the import"
        run: xdb schemas create --uri xdb://$NS/events --json '{"fields":{"kind":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "pipe two creates"
        run: |
          printf '{"op":"records.create","uri":"xdb://%s/events/e1","data":{"kind":"click"}}
          {"op":"records.create","uri":"xdb://%s/events/e2","data":{"kind":"view"}}
          ' "$NS" "$NS" | xdb batch -
        expect: { exit: 0 }

      - name: "list shows both"
        run: xdb records list --uri xdb://$NS/events -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["e1", "e2"]

  - name: "type-fidelity"
    description: "Every CLI-reachable value type survives a create→get round-trip verbatim — unicode strings, negative ints, sub-2^53 unsigned, a >2^53 integer, floats, RFC3339 time, base64 bytes, scalar arrays, integer arrays, a JSON object field, and a JSON array."
    steps:
      - name: "schema covering the round-trippable types"
        run: xdb schemas create --uri xdb://$NS/samples --json '{"fields":{"s":{"type":"string"},"i":{"type":"integer"},"u":{"type":"unsigned"},"f":{"type":"float"},"b":{"type":"boolean"},"t":{"type":"time"},"by":{"type":"bytes"},"tags":{"type":"array","elem_type":"string"},"prices":{"type":"array","elem_type":"float"},"ints":{"type":"array","elem_type":"integer"},"j":{"type":"json"},"objs":{"type":"array","elem_type":"json"},"big":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "create with edge values (unicode, negative int, base64 bytes, RFC3339 time, integer array, JSON object/array, >2^53 integer)"
        run: xdb records create --uri xdb://$NS/samples/r1 --json '{"s":"नमस्ते","i":-42,"u":998877665544,"f":0.07,"b":true,"t":"2024-06-01T10:00:00Z","by":"aGVsbG8=","tags":["silk","handloom"],"prices":[12999.5,499.5],"ints":[1,2,3],"j":{"theme":"dark","level":2},"objs":[{"x":1},{"y":"z"}],"big":9007199254740993}' -o json
        expect:
          exit: 0
          json: { _id: "r1", s: "नमस्ते", i: -42, u: 998877665544, f: 0.07, b: true, t: "2024-06-01T10:00:00Z", by: "aGVsbG8=", ints: [1, 2, 3], j: { theme: "dark", level: 2 }, big: 9007199254740993 }

      - name: "get returns every scalar and structured value verbatim"
        run: xdb records get --uri xdb://$NS/samples/r1 -o json
        expect:
          exit: 0
          json: { s: "नमस्ते", i: -42, u: 998877665544, f: 0.07, b: true, t: "2024-06-01T10:00:00Z", by: "aGVsbG8=", ints: [1, 2, 3], j: { theme: "dark", level: 2 }, objs: [{ x: 1 }, { y: "z" }], big: 9007199254740993 }

      - name: "scalar and JSON arrays round-trip"
        run: xdb records get --uri xdb://$NS/samples/r1 -o json
        expect:
          exit: 0
          stdout_contains: "handloom"

      - name: "patch one field preserves the rest"
        run: xdb records update --uri xdb://$NS/samples/r1 --json '{"b":false}' -o json
        expect:
          exit: 0
          json: { b: false, s: "नमस्ते", i: -42, by: "aGVsbG8=", j: { theme: "dark", level: 2 }, big: 9007199254740993 }

  - name: "crm-pipeline"
    description: "A sales team models Indian contacts in flexible mode: nested addresses, undeclared fields, tag arrays, filtered lists, an NDJSON export/import migration, and schema evolution."
    steps:
      - name: "flexible contacts schema with nested address"
        run: xdb schemas create --uri xdb://$NS/contacts --json '{"mode":"flexible","fields":{"name":{"type":"string"},"email":{"type":"string","required":true},"verified":{"type":"boolean"},"score":{"type":"float"},"tags":{"type":"array","elem_type":"string"},"address.city":{"type":"string"},"address.state":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "contact with an undeclared field (flexible accepts gstin)"
        run: xdb records create --uri xdb://$NS/contacts/priya --json '{"name":"Priya Sharma","email":"priya@acme.in","verified":true,"score":92.5,"tags":["enterprise","mumbai"],"address":{"city":"Mumbai","state":"MH"},"gstin":"27ABCDE1234F1Z5"}' -o json
        expect:
          exit: 0
          json: { _id: "priya", gstin: "27ABCDE1234F1Z5", address: { city: "Mumbai", state: "MH" } }

      - name: "second contact (verified, high score)"
        run: xdb records create --uri xdb://$NS/contacts/arjun --json '{"name":"Arjun Mehta","email":"arjun@corp.in","verified":true,"score":88.0,"tags":["enterprise"],"address":{"city":"Bengaluru","state":"KA"}}'
        expect: { exit: 0 }

      - name: "third contact (unverified)"
        run: xdb records create --uri xdb://$NS/contacts/kavita --json '{"name":"Kavita Rao","email":"kavita@startup.in","verified":false,"score":95.0,"tags":["smb"],"address":{"city":"Jaipur","state":"RJ"}}'
        expect: { exit: 0 }

      - name: "patch nested city preserves sibling state"
        run: xdb records update --uri xdb://$NS/contacts/priya --json '{"address":{"city":"Pune"}}' -o json
        expect:
          exit: 0
          json: { address: { city: "Pune", state: "MH" } }

      - name: "filter verified high-scorers"
        run: xdb records list --uri xdb://$NS/contacts --filter 'verified == true && score >= 80.0' -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["priya", "arjun"]

      - name: "export contacts then import into a v2 namespace"
        run: |
          xdb schemas create --uri xdb://$NS/contacts_v2 --json '{"mode":"flexible","fields":{"name":{"type":"string"},"email":{"type":"string","required":true}}}' &&
          xdb export --uri xdb://$NS/contacts | xdb import --uri xdb://$NS/contacts_v2
        expect: { exit: 0 }

      - name: "migrated records present in v2"
        run: xdb records list --uri xdb://$NS/contacts_v2 -o ndjson
        expect:
          exit: 0
          ndjson_count: 3
          ndjson_ids: ["priya", "arjun", "kavita"]

      - name: "evolve schema — add phone"
        run: xdb schemas update --uri xdb://$NS/contacts --json '{"fields":{"phone":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "old record still readable after evolution"
        run: xdb records get --uri xdb://$NS/contacts/kavita -o json
        expect:
          exit: 0
          json: { _id: "kavita", name: "Kavita Rao" }

      - name: "new record uses the added field"
        run: xdb records create --uri xdb://$NS/contacts/dev --json '{"name":"Dev Nair","email":"dev@firm.in","phone":"+91-98200-12345"}' -o json
        expect:
          exit: 0
          json: { phone: "+91-98200-12345" }

  - name: "account-ledger"
    description: "A double-entry ledger in strict mode with money as integer paise (INR). Exercises required fields, typed rejections with actionable error envelopes, balance updates, and filtered entry queries."
    steps:
      - name: "strict accounts schema (money = integer paise)"
        run: xdb schemas create --uri xdb://$NS/accounts --json '{"mode":"strict","fields":{"owner":{"type":"string","required":true},"balance_paise":{"type":"integer","required":true},"currency":{"type":"string","required":true},"frozen":{"type":"boolean"}}}'
        expect: { exit: 0 }

      - name: "strict entries schema"
        run: xdb schemas create --uri xdb://$NS/entries --json '{"mode":"strict","fields":{"account_id":{"type":"string","required":true},"delta_paise":{"type":"integer","required":true},"kind":{"type":"string"},"at":{"type":"time"},"seq":{"type":"unsigned"}}}'
        expect: { exit: 0 }

      - name: "open Priya's account (₹50,000)"
        run: xdb records create --uri xdb://$NS/accounts/priya --json '{"owner":"Priya Sharma","balance_paise":5000000,"currency":"INR","frozen":false}' -o json
        expect:
          exit: 0
          json: { _id: "priya", balance_paise: 5000000, currency: "INR" }

      - name: "open Arjun's account (₹10,000)"
        run: xdb records create --uri xdb://$NS/accounts/arjun --json '{"owner":"Arjun Mehta","balance_paise":1000000,"currency":"INR","frozen":false}'
        expect: { exit: 0 }

      - name: "post debit entry (₹1,200 UPI out of Priya)"
        run: xdb records create --uri xdb://$NS/entries/e1 --json '{"account_id":"priya","delta_paise":-120000,"kind":"upi","at":"2024-06-01T09:00:00Z","seq":1}'
        expect: { exit: 0 }

      - name: "post credit entry (₹1,200 UPI into Arjun)"
        run: xdb records create --uri xdb://$NS/entries/e2 --json '{"account_id":"arjun","delta_paise":120000,"kind":"upi","at":"2024-06-01T09:00:00Z","seq":2}'
        expect: { exit: 0 }

      - name: "settle Priya's balance via patch (keeps owner + currency)"
        run: xdb records update --uri xdb://$NS/accounts/priya --json '{"balance_paise":4880000}' -o json
        expect:
          exit: 0
          json: { balance_paise: 4880000, owner: "Priya Sharma", currency: "INR" }

      - name: "missing required owner → SCHEMA_VIOLATION"
        run: xdb records create --uri xdb://$NS/accounts/bad1 --json '{"balance_paise":100,"currency":"INR"}' -o json
        expect:
          exit_nonzero: true
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "create" }

      - name: "wrong type for balance_paise → SCHEMA_VIOLATION"
        run: xdb records create --uri xdb://$NS/accounts/bad2 --json '{"owner":"X","balance_paise":"lots","currency":"INR"}' -o json
        expect:
          exit_nonzero: true
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "create" }

      - name: "undeclared field on strict schema → SCHEMA_VIOLATION"
        run: xdb records create --uri xdb://$NS/accounts/bad3 --json '{"owner":"X","balance_paise":1,"currency":"INR","spurious":true}' -o json
        expect:
          exit_nonzero: true
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "create" }

      - name: "get a non-existent account → NOT_FOUND"
        run: xdb records get --uri xdb://$NS/accounts/ghost -o json
        expect:
          exit: 1
          error: { code: "NOT_FOUND", resource: "records", action: "get" }

      - name: "filter debits (negative deltas)"
        run: xdb records list --uri xdb://$NS/entries --filter 'delta_paise < 0' -o ndjson
        expect:
          exit: 0
          ndjson_count: 1
          ndjson_ids: ["e1"]

  - name: "ecommerce-orders"
    description: "An online store (INR) models products, orders, and line items as linked records — the CLI-native pattern, since object arrays are not declarable via the wire schema. Covers unsigned stock, integer paise, scalar-array categories, upsert-vs-patch, cross-record linking by order_id, and cascade delete."
    steps:
      - name: "products schema"
        run: xdb schemas create --uri xdb://$NS/products --json '{"fields":{"sku":{"type":"string","required":true},"title":{"type":"string"},"price_paise":{"type":"integer"},"stock":{"type":"unsigned"},"categories":{"type":"array","elem_type":"string"}}}'
        expect: { exit: 0 }

      - name: "orders schema"
        run: xdb schemas create --uri xdb://$NS/orders --json '{"fields":{"status":{"type":"string"},"placed_at":{"type":"time"},"total_paise":{"type":"integer"},"customer":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "line_items schema (linked by order_id)"
        run: xdb schemas create --uri xdb://$NS/line_items --json '{"fields":{"order_id":{"type":"string","required":true},"sku":{"type":"string"},"qty":{"type":"unsigned"},"price_paise":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "create saree product"
        run: xdb records create --uri xdb://$NS/products/saree --json '{"sku":"SAREE-KANCHI-01","title":"Kanchipuram Silk Saree","price_paise":1299900,"stock":8,"categories":["sarees","handloom"]}' -o json
        expect:
          exit: 0
          json: { _id: "saree", price_paise: 1299900, stock: 8 }

      - name: "create chai product"
        run: xdb records create --uri xdb://$NS/products/chai --json '{"sku":"CHAI-MASALA-500","title":"Masala Chai 500g","price_paise":49900,"stock":120,"categories":["beverages","grocery"]}'
        expect: { exit: 0 }

      - name: "place an order"
        run: xdb records create --uri xdb://$NS/orders/o1 --json '{"status":"placed","placed_at":"2024-06-01T12:30:00Z","total_paise":1349800,"customer":"Priya Sharma"}' -o json
        expect:
          exit: 0
          json: { _id: "o1", status: "placed", total_paise: 1349800 }

      - name: "add two line items linked to the order"
        run: |
          xdb records create --uri xdb://$NS/line_items/o1-1 --json '{"order_id":"o1","sku":"SAREE-KANCHI-01","qty":1,"price_paise":1299900}' &&
          xdb records create --uri xdb://$NS/line_items/o1-2 --json '{"order_id":"o1","sku":"CHAI-MASALA-500","qty":1,"price_paise":49900}'
        expect: { exit: 0 }

      - name: "list this order's line items"
        run: xdb records list --uri xdb://$NS/line_items --filter 'order_id == "o1"' -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["o1-1", "o1-2"]

      - name: "decrement saree stock via patch (preserves title)"
        run: xdb records update --uri xdb://$NS/products/saree --json '{"stock":7}' -o json
        expect:
          exit: 0
          json: { stock: 7, title: "Kanchipuram Silk Saree" }

      - name: "upsert order to shipped (full replace)"
        run: xdb records upsert --uri xdb://$NS/orders/o1 --json '{"status":"shipped","placed_at":"2024-06-01T12:30:00Z","total_paise":1349800}' -o json
        expect:
          exit: 0
          json: { _id: "o1", status: "shipped" }

      - name: "cascade delete the orders schema"
        run: xdb schemas delete --uri xdb://$NS/orders --cascade --force
        expect: { exit: 0 }

      - name: "orders gone after cascade"
        run: xdb records list --uri xdb://$NS/orders -o ndjson
        expect:
          exit: 0
          ndjson_count: 0

      - name: "products untouched by the orders cascade"
        run: xdb records list --uri xdb://$NS/products -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["saree", "chai"]

  - name: "trading-day"
    description: "An NSE market-data feed in dynamic mode: ticks with float prices and unsigned volumes, schema auto-evolution on a new field, a CEL price filter, paginated scans, and sub-rupee float fidelity."
    steps:
      - name: "dynamic ticks schema"
        run: xdb schemas create --uri xdb://$NS/ticks --json '{"mode":"dynamic","fields":{"symbol":{"type":"string"},"price":{"type":"float"},"volume":{"type":"unsigned"},"ts":{"type":"time"},"halted":{"type":"boolean"}}}'
        expect: { exit: 0 }

      - name: "tick 1 — RELIANCE"
        run: xdb records create --uri xdb://$NS/ticks/t1 --json '{"symbol":"RELIANCE","price":2985.55,"volume":1200,"ts":"2024-06-01T03:45:00Z","halted":false}' -o json
        expect:
          exit: 0
          json: { symbol: "RELIANCE", price: 2985.55, ts: "2024-06-01T03:45:00Z" }

      - name: "ticks 2-6 across symbols"
        run: |
          xdb records create --uri xdb://$NS/ticks/t2 --json '{"symbol":"RELIANCE","price":2991.10,"volume":800,"ts":"2024-06-01T03:46:00Z","halted":false}' &&
          xdb records create --uri xdb://$NS/ticks/t3 --json '{"symbol":"INFY","price":1642.10,"volume":500,"ts":"2024-06-01T03:45:00Z","halted":false}' &&
          xdb records create --uri xdb://$NS/ticks/t4 --json '{"symbol":"INFY","price":1639.75,"volume":650,"ts":"2024-06-01T03:46:00Z","halted":false}' &&
          xdb records create --uri xdb://$NS/ticks/t5 --json '{"symbol":"RELIANCE","price":2895.50,"volume":300,"ts":"2024-06-01T03:47:00Z","halted":false}' &&
          xdb records create --uri xdb://$NS/ticks/t6 --json '{"symbol":"YESBANK","price":7.05,"volume":90000,"ts":"2024-06-01T03:45:00Z","halted":true}'
        expect: { exit: 0 }

      - name: "dynamic mode accepts a new field"
        run: xdb records create --uri xdb://$NS/ticks/t7 --json '{"symbol":"TCS","price":3820.40,"volume":210,"ts":"2024-06-01T03:48:00Z","halted":false,"exchange":"NSE"}'
        expect: { exit: 0 }

      - name: "schema evolved to include the new field"
        run: xdb schemas get --uri xdb://$NS/ticks -o json
        expect:
          exit: 0
          stdout_contains: "exchange"

      - name: "filter RELIANCE ticks above 2900 (t5 is below)"
        run: xdb records list --uri xdb://$NS/ticks --filter 'symbol == "RELIANCE" && price > 2900.0' -o ndjson
        expect:
          exit: 0
          ndjson_count: 2
          ndjson_ids: ["t1", "t2"]

      - name: "page 1 — three ticks"
        run: xdb records list --uri xdb://$NS/ticks --limit 3 -o ndjson
        expect:
          exit: 0
          ndjson_count: 3

      - name: "page 2 — three more"
        run: xdb records list --uri xdb://$NS/ticks --limit 3 --offset 3 -o ndjson
        expect:
          exit: 0
          ndjson_count: 3

      - name: "sub-rupee float and unsigned volume round-trip"
        run: xdb records get --uri xdb://$NS/ticks/t6 -o json
        expect:
          exit: 0
          json: { symbol: "YESBANK", price: 7.05, volume: 90000, halted: true }

  - name: "cli-contract-basics"
    description: "The CLI's own dispatch and usage-error contract: unknown commands and typos return an INVALID_ARGUMENT envelope instead of dumping help at exit 0, bare xdb shows help, the agent guide moved to its own command, and flag/subcommand mistakes render one clean envelope instead of urfave's raw usage text."
    steps:
      - name: "unknown command → INVALID_ARGUMENT, not a silent exit 0"
        run: xdb frobnicate-nonexistent
        expect: { exit: 3, stderr_contains: "INVALID_ARGUMENT" }

      - name: "bare xdb shows help, not the agent guide"
        run: xdb
        expect: { exit: 0, stdout_contains: "RESOURCES:" }

      - name: "xdb context prints the agent guide"
        run: xdb context
        expect: { exit: 0, stdout_contains: "# XDB CLI Context" }

      - name: "unknown flag on records list is an envelope, not urfave's raw text"
        run: xdb records list --no-such-flag
        expect: { exit: 3, error: { code: "INVALID_ARGUMENT" } }

      - name: "--help on a nonexistent subcommand still reports a clean error"
        run: xdb schemas upsert --help
        expect: { exit: 3, stderr_contains: "No help topic" }

  - name: "error-classes"
    description: "Reachable subset of the CLI's error-class contract: a schema-violating line mid-import renders one SCHEMA_VIOLATION envelope naming the line, an unknown skill is NOT_FOUND, and a malformed --uri to describe is INVALID_ARGUMENT. (Daemon-down assertions for describe/records/schemas live as unit tests in cmd/xdb/cli — the e2e runner shares one daemon across all scenarios per RUNBOOK.md, so stopping it mid-suite is out of scope here.)"
    steps:
      - name: "schema requiring name"
        run: xdb schemas create --uri xdb://$NS/items --json '{"fields":{"name":{"type":"string","required":true}}}'
        expect: { exit: 0 }

      - name: "import — second line missing required field → one SCHEMA_VIOLATION naming line 2"
        run: |
          printf '{"_id":"a","name":"widget"}\n{"_id":"b","other":"no name here"}\n' | xdb import --uri xdb://$NS/items
        expect:
          exit_nonzero: true
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "upsert" }
          stderr_contains: "line 2"

      - name: "skills get unknown skill → NOT_FOUND"
        run: xdb skills get nosuch-skill-xyz
        expect:
          exit: 1
          error: { code: "NOT_FOUND", resource: "skills", action: "get" }

      - name: "describe --uri malformed → INVALID_ARGUMENT"
        run: xdb describe --uri not-a-uri
        expect:
          exit: 3
          error: { code: "INVALID_ARGUMENT", resource: "schemas", action: "describe" }

      - name: "filter syntax error → INVALID_ARGUMENT"
        run: xdb records list --uri xdb://$NS/items --filter 'name =='
        expect:
          exit: 3
          error: { code: "INVALID_ARGUMENT", resource: "records", action: "list" }

      - name: "strict schema filter on unknown field → INVALID_ARGUMENT naming the field"
        run: xdb records list --uri xdb://$NS/items --filter 'nosuchfield == "x"'
        expect:
          exit: 3
          error: { code: "INVALID_ARGUMENT", resource: "records", action: "list" }
          stderr_contains: "nosuchfield"

  - name: "conflict-and-idempotency"
    description: "records/schemas create is idempotent on an identical re-create and signals CONFLICT on a divergent one; delete --force stays idempotent."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/widgets --json '{"fields":{"name":{"type":"string","required":true},"qty":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "create record"
        run: xdb records create --uri xdb://$NS/widgets/w1 --json '{"name":"sprocket","qty":10}' -o json
        expect:
          exit: 0
          json: { name: "sprocket", qty: 10 }

      - name: "re-create with identical payload → idempotent success"
        run: xdb records create --uri xdb://$NS/widgets/w1 --json '{"name":"sprocket","qty":10}' -o json
        expect:
          exit: 0
          json: { name: "sprocket", qty: 10 }

      - name: "re-create with different payload → CONFLICT"
        run: xdb records create --uri xdb://$NS/widgets/w1 --json '{"name":"sprocket","qty":99}' -o json
        expect:
          exit: 1
          error: { code: "CONFLICT", resource: "records", action: "create" }

      - name: "delete --force"
        run: xdb records delete --uri xdb://$NS/widgets/w1 --force
        expect: { exit: 0 }

      - name: "delete --force again is idempotent"
        run: xdb records delete --uri xdb://$NS/widgets/w1 --force
        expect: { exit: 0 }

      - name: "re-create schema with identical definition → idempotent success"
        run: xdb schemas create --uri xdb://$NS/widgets --json '{"fields":{"name":{"type":"string","required":true},"qty":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "re-create schema with a changed definition → CONFLICT"
        run: xdb schemas create --uri xdb://$NS/widgets --json '{"fields":{"name":{"type":"string","required":true},"qty":{"type":"integer"},"sku":{"type":"string"}}}'
        expect:
          exit: 1
          error: { code: "CONFLICT", resource: "schemas", action: "create" }

  - name: "dry-run-contract"
    description: "--dry-run validates without writing on records and schemas; violations surface exactly as the real call would."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/tasks --json '{"fields":{"title":{"type":"string","required":true},"done":{"type":"boolean"}}}'
        expect: { exit: 0 }

      - name: "dry-run create reports would=create"
        run: xdb records create --uri xdb://$NS/tasks/t1 --json '{"title":"Try"}' --dry-run -o json
        expect:
          exit: 0
          json: { dry_run: true, valid: true, would: "create" }

      - name: "dry-run create did not write"
        run: xdb records get --uri xdb://$NS/tasks/t1 -o json
        expect:
          exit: 1
          error: { code: "NOT_FOUND", resource: "records", action: "get" }

      - name: "dry-run create surfaces schema violations"
        run: xdb records create --uri xdb://$NS/tasks/t2 --json '{"done":true}' --dry-run -o json
        expect:
          exit: 1
          error: { code: "SCHEMA_VIOLATION", resource: "records", action: "create" }

      - name: "create for real"
        run: xdb records create --uri xdb://$NS/tasks/t1 --json '{"title":"Try"}'
        expect: { exit: 0 }

      - name: "dry-run delete preserves the record"
        run: xdb records delete --uri xdb://$NS/tasks/t1 --force --dry-run -o json
        expect:
          exit: 0
          json: { dry_run: true, would: "delete" }

      - name: "record survives dry-run delete"
        run: xdb records get --uri xdb://$NS/tasks/t1 --quiet
        expect: { exit: 0 }

      - name: "schemas delete without --force is rejected"
        run: xdb schemas delete --uri xdb://$NS/tasks
        expect:
          exit: 3
          error: { code: "INVALID_ARGUMENT", resource: "schemas", action: "delete" }

  - name: "batch-atomic"
    description: "batch executes {op,uri,data} operations atomically: a mid-batch violation rolls back every operation with per-op attribution; dry-run validates without writing."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/parts --json '{"fields":{"name":{"type":"string","required":true},"qty":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "atomic batch of three ops"
        run: xdb batch --json '[{"op":"records.create","uri":"xdb://$NS/parts/p1","data":{"name":"bolt","qty":100}},{"op":"records.create","uri":"xdb://$NS/parts/p2","data":{"name":"nut","qty":200}},{"op":"records.update","uri":"xdb://$NS/parts/p1","data":{"qty":150}}]' -o json
        expect:
          exit: 0
          json: { total: 3, succeeded: 3, failed: 0 }

      - name: "mid-batch violation rolls back"
        run: xdb batch --json '[{"op":"records.create","uri":"xdb://$NS/parts/p3","data":{"name":"washer","qty":10}},{"op":"records.create","uri":"xdb://$NS/parts/bad","data":{"qty":1}}]' -o json
        expect:
          exit: 0
          json: { rolled_back: true, failed: 1 }

      - name: "rolled-back op did not persist"
        run: xdb records get --uri xdb://$NS/parts/p3 -o json
        expect:
          exit: 1
          error: { code: "NOT_FOUND", resource: "records", action: "get" }

      - name: "dry-run batch validates without writing"
        run: xdb batch --json '[{"op":"records.create","uri":"xdb://$NS/parts/p4","data":{"name":"screw","qty":5}}]' --dry-run -o json
        expect:
          exit: 0
          json: { succeeded: 1 }

      - name: "dry-run op did not persist"
        run: xdb records get --uri xdb://$NS/parts/p4 --quiet
        expect: { exit: 1 }

  - name: "pagination-and-fields"
    description: "List pagination returns a total/next_offset envelope in json, bare items in ndjson; --page-all walks every page; namespaces.get exposes the schema tree."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/rows --json '{"fields":{"n":{"type":"integer"}}}'
        expect: { exit: 0 }

      - name: "seed five records"
        run: |
          for i in 1 2 3 4 5; do xdb records create --uri xdb://$NS/rows/r$i --json "{\"n\":$i}" --quiet; done
        expect: { exit: 0 }

      - name: "json list carries page envelope"
        run: xdb records list --uri xdb://$NS/rows --limit 2 -o json
        expect:
          exit: 0
          json: { total: 5, next_offset: 2 }

      - name: "ndjson list stays a bare stream"
        run: xdb records list --uri xdb://$NS/rows --limit 5 -o ndjson
        expect:
          exit: 0
          ndjson_count: 5

      - name: "--page-all fetches every page"
        run: xdb records list --uri xdb://$NS/rows --limit 2 --page-all -o ndjson
        expect:
          exit: 0
          ndjson_count: 5

      - name: "namespaces get lists the schema tree"
        run: xdb get xdb://$NS -o json
        expect:
          exit: 0
          json: { total_schemas: 1 }

  - name: "watch-stream"
    description: "watch emits a ready marker then one NDJSON event per change, ending cleanly when killed."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/feed --json '{"fields":{"msg":{"type":"string"}}}'
        expect: { exit: 0 }

      - name: "watch captures create and update events"
        run: |
          out="$(mktemp)"
          xdb watch --uri xdb://$NS/feed > "$out" 2>/dev/null &
          wpid=$!
          sleep 1
          xdb records create --uri xdb://$NS/feed/m1 --json '{"msg":"hello"}' --quiet
          xdb records update --uri xdb://$NS/feed/m1 --json '{"msg":"edited"}' --quiet
          sleep 1
          kill "$wpid" 2>/dev/null || true
          wait "$wpid" 2>/dev/null || true
          cat "$out"
          rm -f "$out"
        expect:
          exit: 0
          stdout_contains: "\"ready\":true"

      - name: "events carried types and uris"
        run: |
          out="$(mktemp)"
          xdb watch --uri xdb://$NS/feed > "$out" 2>/dev/null &
          wpid=$!
          sleep 1
          xdb records create --uri xdb://$NS/feed/m2 --json '{"msg":"two"}' --quiet
          sleep 1
          kill "$wpid" 2>/dev/null || true
          wait "$wpid" 2>/dev/null || true
          grep -c "record.create" "$out"
          rm -f "$out"
        expect:
          exit: 0
          stdout_contains: "1"

  - name: "import-accounting"
    description: "import reports machine-readable {imported, skipped, failed, first_error_line} counts; --create-only keeps local data on divergence and counts it as skipped."
    steps:
      - name: "create schema"
        run: xdb schemas create --uri xdb://$NS/inv --json '{"fields":{"name":{"type":"string","required":true}}}'
        expect: { exit: 0 }

      - name: "clean import counts records"
        run: |
          printf '{"_id":"a","name":"one"}\n{"_id":"b","name":"two"}\n' | xdb import --uri xdb://$NS/inv
        expect:
          exit: 0
          json: { imported: 2, skipped: 0, failed: 0 }

      - name: "create-only skips divergent records and keeps local data"
        run: |
          printf '{"_id":"a","name":"DIFFERENT"}\n{"_id":"c","name":"three"}\n' | xdb import --uri xdb://$NS/inv --create-only
        expect:
          exit: 0
          json: { imported: 1, skipped: 1 }

      - name: "local data survived the divergent import"
        run: xdb records get --uri xdb://$NS/inv/a -o json
        expect:
          exit: 0
          json: { name: "one" }

      - name: "mid-file violation reports the physical line"
        run: |
          printf '{"_id":"d","name":"four"}\n\n{"_id":"e"}\n' | xdb import --uri xdb://$NS/inv
        expect:
          exit_nonzero: true
          json: { imported: 1, failed: 1, first_error_line: 3 }
          stderr_contains: "line 3"

  - name: "skills-verbatim"
    description: "The bundled getting-started skill executes verbatim: its schema payload is accepted and the CRUD loop it teaches completes."
    steps:
      - name: "skill schema payload is valid"
        run: xdb schemas create --uri xdb://$NS/todos --json '{"fields":{"title":{"type":"string"},"done":{"type":"boolean"}}}'
        expect: { exit: 0 }

      - name: "skill create step"
        run: xdb records create --uri xdb://$NS/todos/todo-1 --json '{"title":"Try XDB","done":false}'
        expect: { exit: 0 }

      - name: "skill get step"
        run: xdb records get --uri xdb://$NS/todos/todo-1 -o json
        expect:
          exit: 0
          json: { title: "Try XDB", done: false }

      - name: "skill list step"
        run: xdb records list --uri xdb://$NS/todos --fields title,done -o ndjson
        expect:
          exit: 0
          ndjson_count: 1

      - name: "skill update step"
        run: xdb records update --uri xdb://$NS/todos/todo-1 --json '{"done":true}' -o json
        expect:
          exit: 0
          json: { done: true, title: "Try XDB" }

      - name: "skill delete step"
        run: xdb records delete --uri xdb://$NS/todos/todo-1 --force
        expect: { exit: 0 }
